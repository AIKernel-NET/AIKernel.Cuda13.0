name: .NET CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AIKernel.Cuda13.0.Libtorch2.12.win-x64.slnx
      - name: Build
        id: build
        run: dotnet build AIKernel.Cuda13.0.Libtorch2.12.win-x64.slnx -c Release --no-restore
      - name: Test
        run: dotnet test AIKernel.Cuda13.0.Libtorch2.12.win-x64.slnx -c Release --no-build --no-restore
      - name: Verify packing requires the Windows native bridge
        shell: bash
        run: |
          if dotnet pack AIKernel.Cuda13.0.Libtorch2.12.win-x64.slnx -c Release --no-build --no-restore -p:AIKernelNativeBridgePath="$RUNNER_TEMP/missing-bridge.dll" >pack.log 2>&1; then
            exit 1
          fi
          grep -F 'The native LibTorch bridge is required' pack.log
